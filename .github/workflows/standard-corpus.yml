name: Standard Corpus

# Runs the standard corpus (corpus.toml) for each subject. Each selection
# runs only the cases the subject's manifest covers; selections the
# subject cannot satisfy are reported and skipped.
#
# Triggered on a weekly schedule and manually; master pushes do not run
# the full corpus (hours of runner time) — bench-pr covers pin bumps.

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      subject:
        description: "Which subject to bench (all if empty)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  bench:
    name: "Bench ${{ matrix.subject }}"
    runs-on: [self-hosted, benchmark]
    strategy:
      matrix:
        subject: ${{ fromJSON(vars.SUBJECTS || '["kiddo_v6", "nanoflann", "pykdtree"]') }}
      # One job at a time — the runner processes a single benchmark run.
      max-parallel: 1
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Checkout the engine
        uses: actions/checkout@v4
        with:
          repository: spatial-bench/spatial-bench-core
          ref: main
          path: engine

      - name: Install system dependencies
        run: |
          missing=""
          for p in libfontconfig1-dev pkg-config cmake g++ python3-venv; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          if [ -z "$missing" ]; then
            echo "all system dependencies present"
          elif sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y $missing
          else
            echo "::error::missing system packages:$missing — install them once as root; the runner user has no sudo by design"
            exit 1
          fi

      - name: Install `stable` toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build the engine
        run: cargo build --release -p spatial-bench
        working-directory: engine

      - name: Run the standard corpus
        run: |
          SUBJECT="${{ matrix.subject }}"
          if [ -n "${{ inputs.subject }}" ]; then
            SUBJECT="${{ inputs.subject }}"
          fi
          # Extract the select expressions from corpus.toml.
          SELECTS=$(grep '^select = ' corpus.toml | sed 's/^select = "//; s/"$//')
          echo "Running $SUBJECT against the standard corpus:"
          echo "$SELECTS"
          while IFS= read -r sel; do
            [ -z "$sel" ] && continue
            name=$(echo "$sel" | cut -d, -f1 | tr '=' '_' | tr -d ' ')
            echo "=== selection: $sel ==="
            ./engine/target/release/spatial-bench run \
              --subjects "$GITHUB_WORKSPACE/subjects" \
              --select "impl=$SUBJECT,$sel" \
              --allow-unfingerprinted || echo "selection not satisfiable: $sel"
          done <<< "$SELECTS"

      - name: Save run documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ matrix.subject }}
          path: ~/.local/share/spatial-bench/runs/
