name: Manual Benchmark

# Runs a subject against the standard corpus (corpus.toml), optionally
# pinning a specific version first. This is the entry point for
# benchmarking a newly-published library release on demand.

on:
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject from the catalog (kiddo_v6, nanoflann, pykdtree)"
        required: true
        type: string
      version:
        description: "Version to pin (e.g. v6.1.0, 1.7.1, 1.4.3); empty = keep the current pin"
        required: false
        type: string

permissions:
  contents: read

jobs:
  bench:
    name: "Bench ${{ inputs.subject }} ${{ inputs.version }}"
    runs-on: [self-hosted, benchmark]
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Clear previous run documents
        run: rm -rf ~/.local/share/spatial-bench/runs

      - name: Checkout the engine
        uses: actions/checkout@v4
        with:
          repository: spatial-bench/spatial-bench-core
          ref: main
          path: engine

      - name: Install system dependencies
        run: |
          missing=""
          for p in libfontconfig1-dev pkg-config cmake g++ python3-venv; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          if [ -z "$missing" ]; then
            echo "all system dependencies present"
          elif sudo -n true 2>/dev/null; then
            sudo apt-get update && sudo apt-get install -y $missing
          else
            echo "::error::missing system packages:$missing — install them once as root; the runner user has no sudo by design"
            exit 1
          fi

      - name: Install `stable` toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build the engine
        run: cargo build --release -p spatial-bench -p spatial-bench-dataset
        working-directory: engine

      - name: Pin ${{ inputs.subject }} to ${{ inputs.version }}
        if: inputs.version != ''
        run: |
          manifest="subjects/${{ inputs.subject }}/subject.toml"
          sed -i "s|pinned_ref = \".*\"|pinned_ref = \"${{ inputs.version }}\"|" "$manifest"
          # Drop the sha — the build resolves the new ref and records it.
          sed -i "/^sha = /d" "$manifest"
          grep -E "pinned_ref|^sha" "$manifest" || true

      - name: Run the standard corpus
        run: |
          SUBJECT="${{ inputs.subject }}"
          SELECTS=$(grep '^select = ' corpus.toml | sed 's/^select = "//; s/"$//')
          echo "Running $SUBJECT against the standard corpus:"
          echo "$SELECTS"
          while IFS= read -r sel; do
            [ -z "$sel" ] && continue
            echo "=== selection: $sel ==="
            COUNT=$(./engine/target/release/spatial-bench list \
              --subjects "$GITHUB_WORKSPACE/subjects" \
              --select "impl=$SUBJECT,$sel" 2>/dev/null | tail -1)
            echo "$COUNT"
            if ! echo "$COUNT" | grep -qE '[1-9][0-9]* points'; then
              echo "skipping: the subject's manifest covers none of this selection"
              continue
            fi
            ./engine/target/release/spatial-bench run \
              --subjects "$GITHUB_WORKSPACE/subjects" \
              --select "impl=$SUBJECT,$sel"
          done <<< "$SELECTS"

      - name: Save run documents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runs-${{ inputs.subject }}-${{ inputs.version }}
          path: ~/.local/share/spatial-bench/runs/
      - name: Checkout the results repo
        if: success()
        uses: actions/checkout@v4
        with:
          repository: spatial-bench/spatial-bench-results
          ref: main
          token: ${{ secrets.RESULTS_PAT }}
          path: spatial-bench-results

      - name: Install gh
        if: success()
        run: |
          GH_VERSION=2.62.0
          curl -sL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" | tar xz
          echo "$PWD/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Submit the results
        if: success()
        env:
          GH_TOKEN: ${{ secrets.RESULTS_PAT }}
        run: |
          git -C spatial-bench-results config user.name "spatial-bench-ci"
          git -C spatial-bench-results config user.email "ci@spatial-bench.invalid"
          ./engine/target/release/spatial-bench submit \
            --to "$GITHUB_WORKSPACE/spatial-bench-results"

