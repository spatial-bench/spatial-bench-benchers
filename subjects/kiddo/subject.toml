# kiddo, as a vendored subject.
#
# kiddo gets no privileged path despite being the engine author's own library:
# its manifest sits alongside nanoflann's and is reviewed the same way. That
# symmetry is the trust argument in the design's "Subjects are always vendored".
#
# Nothing is added to the kiddo repo for any of this. The engine owns the
# harness (design section 5): the driver crate calls kiddo's public API and
# nothing else, so what is measured, how points are generated and what sits
# inside the timed region are all decided here rather than by the subject.

schema = 1
name = "kiddo_v6"
domain = "spatial_index"

# A floor, not a pin: the engine resolves one toolchain per run as the highest
# floor among selected subjects, so everything in a run is built the same way.
[toolchain]
min_rustc = "1.89.0"

[source]
kind = "cargo-git"
repo = "https://github.com/sdd/kiddo"
# The cyclic SIMD stems the cases below declare landed in v6.0.0; alpha.4
# predates them, and the drift-guard test catches exactly this — a manifest
# must not declare cases its pin cannot build.
pinned_ref = "v6.1.0"
# S1: git tags are mutable, so the manifest also pins the exact commit the ref
# must resolve to; the build refuses anything else. A moved tag is refused at
# build time instead of being detectable only in the run header afterwards.
sha = "0550f806c3f35c33b6bd0aca533112314b6c7c1f"

# Two-phase: the engine generates a main.rs with one `bench_case!` invocation
# per selected compile-time combination, then builds and runs it. Instantiating
# the full cross product is what makes kiddo's own fuzz binary take an age to
# compile.
[driver]
adapter = "rust-codegen"
crate = "spatial-bench-kiddo-v6"
# Day 1.5: the driver crate lives beside this manifest, in the bencher repo —
# the engine carries no subject crates. Its version deps on core + measure are
# patched to the engine checkout at build time.
path = "driver"
# Published version of that crate, for builds with no engine source tree to
# point at (an installed binary). Reviewed with the pin: a driver-crate update
# is a deliberate engine change, and it feeds the build cache key.
version = "0.1.0"
macro = "bench_case"
features = ["test_utils", "simd"]
# The cyclic SIMD strategies need AVX-512, which needs the native target.
rustflags = "-C target-cpu=native"
# Core keys that are generic parameters for kiddo specifically. KdTree
# monomorphises on scalar type, dimensionality and index type; a subject that
# dispatched on them at run time would list none of them here.
compile_time = ["axis", "dims", "idx"]

# The out-of-the-box configuration of kiddo v6.1.0: what the root-level
# `ImmutableKdTree<AX, K>` convenience alias expands to. The runner labels a
# case `defaults_or_tuned = default` when every key here matches the case's
# tags, `tuned` when any differs — so a casual viewer can tell the
# quick-start experience from deliberate configuration without either being
# hidden.
[defaults]
"kiddo.stem" = "eytzinger"
"kiddo.leaf" = "vec_of_arenas"
"kiddo.bucket" = 32
"kiddo.block_height" = 3
"kiddo.storage" = "heap"
isa = "scalar"

# Extension keys this subject contributes, namespaced under `kiddo.` so two
# subjects can both have a `stem` or a `layout` without colliding.
#
# `compile_time` marks a generic parameter: every value is a separate
# monomorphisation, so it drives code generation. Unmarked keys are runtime
# arguments and cost nothing to add to a sweep.
[vocab]
stem.compile_time = true
stem.values = [
  "eytzinger",
  "eytzinger_nopf",
  "donnelly",
  "donnelly_nopf",
  "donnelly_unrolled",
  "donnelly_unrolled_block_dim",
  "donnelly_simd_descent",
  "donnelly_simd_full",
  "donnelly_cyclic_simd_descent",
  "donnelly_cyclic_simd_full",
]
block_height.compile_time = true
block_height.kind = "int"
leaf.compile_time = true
leaf.values = ["flatvec", "vec_of_arenas"]
bucket.compile_time = true
bucket.kind = "int"
storage.values = ["heap", "archived_mmap", "archived_owned"]
hugepages.values = ["on", "off"]
target_results.kind = "int"

# ---------------------------------------------------------------------------
# Default configuration — the out-of-the-box experience, labelled
# `defaults_or_tuned = default` by the runner from [defaults] above. The
# standard corpus runs these: the full axis x query x parallelism x batching
# product the library supports, on the quick-start tree.
# ---------------------------------------------------------------------------

# exact_nn through the single-point query builder. One query cannot be
# parallelised, so these are single_threaded by construction.
[[case]]
runners = ["criterion", "perf"]

matrix.axis = ["f32", "f64"]
matrix.k = [1, 5, 20, 50]

tags.impl = "kiddo_v6"
tags.dataset = "uniform"
tags.query = "exact_nn"
tags.dims = 3
tags.idx = "u32"
tags.metric = "squared_euclidean"
tags.isa = "scalar"
tags.query_batching = "single_query"
tags.parallelism = "single_threaded"
tags."kiddo.block_height" = 3
tags."kiddo.stem" = "eytzinger"
tags."kiddo.leaf" = "vec_of_arenas"
tags."kiddo.bucket" = 32
tags."kiddo.storage" = "heap"

params.tree_size.range = "2^16..2^29"
params.tree_size.default = "2^20"
params.query_count.kind = "int"
params.query_count.default = 1000

# within_radius through the single-point query builder.
[[case]]
runners = ["criterion", "perf"]
tags.impl = "kiddo_v6"
tags.query = "within_radius"
tags.dims = 3
tags.idx = "u32"
tags.metric = "squared_euclidean"
tags.dataset = "uniform"
tags.isa = "scalar"
tags.query_batching = "single_query"
tags.parallelism = "single_threaded"
tags."kiddo.stem" = "eytzinger"
tags."kiddo.leaf" = "vec_of_arenas"
tags."kiddo.bucket" = 32
tags."kiddo.block_height" = 3
tags."kiddo.storage" = "heap"
tags."kiddo.target_results" = 100

matrix.axis = ["f32", "f64"]

params.tree_size.range = "2^16..2^24"
params.tree_size.default = "2^20"
params.query_count.kind = "int"
params.query_count.default = 100

