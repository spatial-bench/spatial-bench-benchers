# Batch exact_nn: many query points per call through `query_batch`, which is
# where kiddo's multi-threaded execution lives. The batch ends are the
# interesting ones: nearest_one (k=1) and nearest_n(50).
[[case]]
runners = ["criterion", "perf"]
tags.impl = "kiddo_v6"
tags.query = "exact_nn"
tags.dims = 3
tags.idx = "u32"
tags.metric = "squared_euclidean"
tags.dataset = "uniform"
tags.isa = "scalar"
tags.query_batching = "batch_query"
tags."kiddo.stem" = "eytzinger"
tags."kiddo.leaf" = "vec_of_arenas"
tags."kiddo.bucket" = 32
tags."kiddo.block_height" = 3
tags."kiddo.storage" = "heap"

matrix.axis = ["f32", "f64"]
matrix.k = [1, 50]
matrix.parallelism = ["single_threaded", "multi_threaded"]

params.tree_size.range = "2^16..2^29"
params.tree_size.default = "2^20"
params.query_count.kind = "int"
params.query_count.default = 1000
params.query_batch_size.kind = "int"
params.query_batch_size.default = 1000

