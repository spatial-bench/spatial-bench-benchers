tags."kiddo.bucket" = 32
tags."kiddo.block_height" = 3
tags."kiddo.storage" = "heap"
tags."kiddo.target_results" = 100

matrix.axis = ["f64"]
matrix."kiddo.stem" = ["eytzinger"]

