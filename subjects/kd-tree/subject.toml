schema = 1
name = "kd-tree"
domain = "spatial_index"

[toolchain]
min_rustc = "1.90.0"

[source]
kind = "cargo-git"
repo = "https://github.com/u1roh/kd-tree"
pinned_ref = "v0.6.2"
sha = "b478e2a881f2bccfa216fcac27fc6a6bbef81215"

[[driver]]
name = "v0"
min_supported_semver = "0.6.0"
max_supported_semver = "0.7.0"
adapter = "rust-codegen"
crate = "spatial-bench-kd-tree"
path = "driver"
version = "0.1.0"
macro = "bench_case"

[defaults]
isa = "native"

[[case]]
runners = ["criterion", "perf"]
matrix.k = [1, 5, 20, 50]
tags.impl = "kd-tree"
tags.dataset = "uniform"
tags.query = "exact_nn"
tags.axis = "f64"
tags.dims = 3
tags.idx = "u32"
tags.metric = "euclidean"
tags.isa = "native"
tags.query_batching = "single_query"
tags.parallelism = "single_threaded"
params.tree_size.range = "2^16..2^24"
params.tree_size.default = "2^20"
params.query_count.kind = "int"
params.query_count.default = 1000
