# nanoflann — an unwilling subject: header-only, never heard of this project.
# Day 1.5: the exec adapter builds its shim from this manifest's recipe, and
# the driver speaks the same harness contract as every other subject
# (--list, RunSpec on stdin, JSONL points on stdout).

schema = 1
name = "nanoflann"
domain = "spatial_index"

[source]
kind = "git"
repo = "https://github.com/jlblancoc/nanoflann"
pinned_ref = "v1.7.1"
# S1: git tags are mutable; the build fetches at this sha and refuses a
# ref that resolves anywhere else.
sha = "9a653cb243db6a09c94f833b28732b62f033e2b5"

[build]
kind = "cxx-shim"
std = "c++20"
flags = ["-O3", "-march=native", "-DNDEBUG"]
# Header locations, relative to the fetched library source root.
include = ["include"]
# The shim compiles one template specialisation per dimensionality here and
# dispatches at run time; axis and k are runtime parameters of the binary.
compile_time_dims = [3, 4]

[vocab]
# nanoflann's own knobs. Namespaced, so `nanoflann.leaf_max_size` never collides
# with `kiddo.bucket` even though both are "leaf capacity".
# Not compile_time: the shim dispatches on it at run time.
leaf_max_size.kind = "int"

[[driver]]
name = "default"
adapter = "exec"
lang = "cxx"
entry = "shim.cpp"

[[case]]
runners = ["criterion", "perf"]

matrix.axis = ["f32", "f64"]
matrix.k = [1, 5, 20, 50]

tags.impl = "nanoflann"
tags.dataset = "uniform"
tags.query_batching = "single_query"
tags.parallelism = "single_threaded"
tags.query = "exact_nn"
tags.dims = 3
tags.idx = "u64"
tags.metric = "squared_euclidean"
tags.isa = "native"
tags."nanoflann.leaf_max_size" = 32

params.tree_size.range = "2^16..2^29"
params.tree_size.default = "2^20"
params.query_count.kind = "int"
params.query_count.default = 1000
