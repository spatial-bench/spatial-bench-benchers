schema = 1
name = "libspatialindex"
domain = "spatial_index"
[source]
kind = "git"
repo = "https://github.com/libspatialindex/libspatialindex.git"
pinned_ref = "2.1.0"
sha = "175b56a9541e76982d13dbbf0c9b8f0b8d752619"
[build]
kind = "cxx-shim"
std = "c++20"
flags = ["-O3", "-march=native", "-DNDEBUG"]
include = ["include"]
[build.cmake]
configure = ["-DBUILD_SHARED_LIBS=OFF", "-DBUILD_TESTING=OFF"]
target = "spatialindex"
libraries = ["src/libspatialindex.a"]
[[driver]]
name = "default"
adapter = "exec"
lang = "cxx"
entry = "shim.cpp"
[[case]]
runners = ["criterion", "perf"]
matrix.k = [1, 5, 20, 50]
tags.impl = "libspatialindex"
tags.dataset = "uniform"
tags.query = "exact_nn"
tags.axis = "f64"
tags.dims = 3
tags.idx = "u64"
tags.metric = "squared_euclidean"
tags.isa = "native"
tags.query_batching = "single_query"
tags.parallelism = "single_threaded"
params.tree_size.range = "2^16..2^24"
params.tree_size.default = "2^20"
params.query_count.kind = "int"
params.query_count.default = 1000
