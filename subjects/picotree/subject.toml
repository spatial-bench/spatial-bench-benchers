schema = 1
name = "picotree"
domain = "spatial_index"
[source]
kind = "git"
repo = "https://github.com/Jaybro/pico_tree"
pinned_ref = "v1.0.0"
sha = "c5f719837df9707ee12d94cb0108aa0c34bfe96f"
[build]
kind = "cxx-shim"
std = "c++20"
flags = ["-O3", "-march=native", "-DNDEBUG"]
include = ["src/pico_tree"]
[[driver]]
name = "default"
adapter = "exec"
lang = "cxx"
entry = "shim.cpp"
[[case]]
runners = ["criterion", "perf"]
matrix.k = [1, 5, 20, 50]
tags.impl = "picotree"
tags.dataset = "uniform"
tags.query = "exact_nn"
tags.axis = "f64"
tags.dims = 3
tags.idx = "u64"
tags.metric = "squared_euclidean"
tags.isa = "native"
tags.query_batching = "single_query"
tags.parallelism = "single_threaded"
params.tree_size.range = "2^16..2^24"
params.tree_size.default = "2^20"
params.query_count.kind = "int"
params.query_count.default = 1000
