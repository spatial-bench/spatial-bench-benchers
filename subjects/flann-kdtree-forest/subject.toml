schema = 1
name = "flann"
domain = "spatial_index"
[source]
kind = "git"
repo = "https://github.com/flann-lib/flann.git"
pinned_ref = "1.9.2"
sha = "c50f296b0b27e14667d272b37acc63f949b305c4"
[build]
kind = "cxx-shim"
std = "c++20"
flags = ["-O3", "-march=native", "-DNDEBUG"]
include = ["src/cpp"]
[build.cmake]
configure = ["-DCMAKE_POLICY_VERSION_MINIMUM=3.5", "-DBUILD_C_BINDINGS=OFF", "-DBUILD_PYTHON_BINDINGS=OFF", "-DBUILD_MATLAB_BINDINGS=OFF", "-DBUILD_EXAMPLES=OFF", "-DBUILD_TESTS=OFF", "-DBUILD_DOC=OFF", "-DUSE_OPENMP=OFF"]
target = "flann_cpp_s"
libraries = ["lib/libflann_cpp_s.a"]
link_args = ["-llz4"]
[[driver]]
name = "default"
adapter = "exec"
lang = "cxx"
entry = "shim.cpp"
[[case]]
runners = ["criterion", "perf"]
matrix.k = [1, 5, 20, 50]
tags.impl = "flann"
tags.dataset = "uniform"
tags.query = "exact_nn"
tags.axis = "f32"
tags.dims = 3
tags.idx = "u32"
tags.metric = "squared_euclidean"
tags.isa = "native"
tags.query_batching = "batch_query"
tags.parallelism = "single_threaded"
params.tree_size.range = "2^16..2^24"
params.tree_size.default = "2^20"
params.query_count.kind = "int"
params.query_count.default = 1000
