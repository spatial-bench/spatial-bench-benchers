schema = 1
name = "sklearn_kdtree"
domain = "spatial_index"
[source]
kind = "pypi"
package = "scikit-learn"
pinned_ref = "1.7.2"
[build]
kind = "python-driver"
[[driver]]
name = "default"
adapter = "exec"
lang = "python"
entry = "driver.py"
[[case]]
runners = ["criterion", "perf"]
matrix.k = [1, 5, 20, 50]
tags.impl = "sklearn_kdtree"
tags.dataset = "uniform"
tags.query = "exact_nn"
tags.axis = "f64"
tags.dims = 3
tags.metric = "euclidean"
tags.isa = "native"
tags.query_batching = "single_query"
tags.parallelism = "single_threaded"
params.tree_size.range = "2^16..2^24"
params.tree_size.default = "2^20"
params.query_count.kind = "int"
params.query_count.default = 1000
