# The standard corpus: the default benchmark selections run against every
# newly-published subject version.
#
# The cartesian product lives in the manifests, not here. Each selection
# pins only the dimensions that are global to the corpus — one scalar axis,
# the uniform dataset, the default configuration, and the tree-size range —
# and sweeps everything else every subject's manifest declares: query
# kinds, k values, parallelism, query batching, and each subject's own
# parameter spaces. A subject runs the subset it supports; dimensions it
# cannot satisfy are simply absent from its points.
#
# `defaults_or_tuned = default` selects the out-of-the-box experience: the
# configuration a new user gets from the library's quick-start entry point,
# as declared in each manifest's [defaults] section. Tuned runs — parameters
# deliberately selected to showcase a library's best performance — are
# submitted separately and labelled by the runner; the web front-end can
# then chart defaults alone or overlay the tuned results.

[[case]]
name = "f64-default"
select = "axis=f64,dims=3,dataset=uniform,defaults_or_tuned=default,tree_size=2^16..2^24"
description = "Everything the product declares, f64, default configuration."

[[case]]
name = "f32-default"
select = "axis=f32,dims=3,dataset=uniform,defaults_or_tuned=default,tree_size=2^16..2^24"
description = "Everything the product declares, f32, default configuration."
